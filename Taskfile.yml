# Task runner (https://taskfile.dev) — `task --list` for an overview.
version: '3'

vars:
  PY: python

tasks:
  setup:
    desc: Maintainer, once per clone - route all GitHub traffic from this repo through the WizX20 account (see .gitconfig)
    cmds:
      - git config --local include.path ../.gitconfig
      - git config user.name
      - git config user.email

  gh:
    desc: Run the GitHub CLI as WizX20 without switching accounts, e.g. task gh -- pr status
    cmds:
      - git gh {{.CLI_ARGS}}

  install:
    desc: Install runtime dependencies
    cmds:
      - '{{.PY}} -m pip install -r src/requirements.txt'

  install-dev:
    desc: Install runtime + test dependencies
    deps: [install]
    cmds:
      - '{{.PY}} -m pip install -r tests/requirements.txt'

  run:
    desc: Run the app from source (with console for debug output)
    cmds:
      - '{{.PY}} src/main.py'

  run:beta:
    desc: Run from source with beta features force-enabled (no config.yaml edit)
    env:
      ACTIONS_MONITOR_BETA: settings_ui
    cmds:
      - '{{.PY}} src/main.py'

  test:
    desc: Run the integration test suite (offscreen Qt, no network). Pass extra pytest args after --
    cmds:
      - '{{.PY}} -m pytest tests {{.CLI_ARGS | default "-v"}}'

  screenshots:
    desc: Regenerate UI screenshots into artifacts/screenshots/
    cmds:
      - '{{.PY}} -m pytest tests -q -k screenshot'
      - 'echo "Screenshots written to artifacts/screenshots/"'

  build:
    desc: Build the standalone Windows exe (PyInstaller onedir + zip)
    platforms: [windows]
    cmds:
      # Task's shell interpreter treats a lone backslash as an escape — keep it doubled.
      - 'cmd /c src\\build.bat'

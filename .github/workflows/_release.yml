name: Release (reusable)

on:
  workflow_call:
    inputs:
      enable_scoop:
        description: "Publish Scoop manifest bump after release"
        type: boolean
        default: true
      enable_winget:
        description: "Submit winget update after release"
        type: boolean
        default: true
      tag_strategy:
        description: "overwrite = delete today's tag and recreate; suffix = try v<date>, then v<date>.2, .3..."
        type: string
        default: suffix
    outputs:
      version_tag:
        description: "The tag that was released (empty when should_build=false)"
        value: ${{ jobs.release.outputs.version_tag }}
    secrets:
      WINGET_PAT:
        required: false
      ACTIONSMONITOR_RELEASE_TOKEN:
        description: "Fine-grained PAT of the owner (Contents: read/write). main only accepts pull requests; the scoop manifest bump is pushed with this token, which bypasses that rule as repository admin."
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify CI on main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Block release unless the CI run of the exact commit being released
          # is success. Weekly Build (cron) and Release (manual dispatch) both
          # funnel through here, so this single gate covers both callers. It
          # looks at HEAD's own run rather than "the latest completed run on
          # main", which after quick successive merges can be a superseded,
          # cancelled one; while HEAD's run is still going it waits (20 min max).
          SHA=$(git rev-parse HEAD)
          for attempt in $(seq 1 40); do
            RUN=$(gh run list -w ci.yml -c "$SHA" -L 1 --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"' 2>/dev/null || echo "")
            case "$RUN" in
              "") echo "No CI run for $SHA — allowing release through."; exit 0 ;;
              completed/success) echo "CI for $SHA is success."; exit 0 ;;
              completed/*) echo "CI for $SHA ended as '${RUN#completed/}'. Refusing to release."; exit 1 ;;
              *) echo "CI for $SHA is $RUN — waiting..."; sleep 30 ;;
            esac
          done
          echo "CI for $SHA did not finish in time. Refusing to release."
          exit 1

      - name: Check for changes since last release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # targetCommitish may return a branch name instead of a SHA —
          # resolve it so the comparison always uses full SHAs.
          LATEST_REF=$(gh release view --json targetCommitish -q '.targetCommitish' 2>/dev/null || echo "")
          if [ -n "$LATEST_REF" ]; then
            LATEST=$(git rev-parse "$LATEST_REF" 2>/dev/null || echo "")
          else
            LATEST=""
          fi
          HEAD=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short=7 HEAD)
          if [ "$LATEST" = "$HEAD" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No changes since last release ($SHORT)"
          elif [ -n "$LATEST" ] && [ -z "$(git diff --name-only "$LATEST" "$HEAD" -- . ':(exclude)bucket/actionsmonitor.json')" ]; then
            # Only the scoop manifest changed since last release. The post-release
            # update-scoop job pushes that file to main, so without this guard the
            # next Weekly Build would self-perpetuate (bump → release → bump → ...).
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only scoop manifest changed since last release ($SHORT) — skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
            echo "Changes detected ($SHORT)"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      short_sha: ${{ needs.check.outputs.short_sha }}

  release:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.create.outputs.version_tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: artifacts/

      - uses: actions/download-artifact@v8
        with:
          name: linux-binary
          path: artifacts/

      - name: Extract changelog
        id: changelog
        run: |
          # Extract the first dated section from CHANGELOG.md
          BODY=$(awk '/^### [0-9]{4}-/{if(found) exit; found=1} found' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="No changelog entry for this release."
          fi
          echo "$BODY" > release_notes.md

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_STRATEGY: ${{ inputs.tag_strategy }}
        run: |
          BASE="v$(date -u +%Y.%m.%d)"
          TAG="$BASE"

          # overwrite: delete today's tag+release first so we can recreate it.
          # GitHub's immutable-releases feature may still reserve the name;
          # fall through to the retry loop in that case.
          if [ "$TAG_STRATEGY" = "overwrite" ]; then
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push --delete origin "$TAG" 2>/dev/null || true
          fi

          # Retry loop: on tag reservation collision, try v<date>.2, .3, ...
          # GitHub reserves tag names permanently even after release deletion
          # and offers no API to query reservations — retry-on-failure is the
          # only robust approach.
          N=2
          for attempt in $(seq 1 20); do
            OUT=$(mktemp)
            if gh release create "$TAG" \
                 --title "Actions Monitor $TAG" \
                 --notes-file release_notes.md \
                 --target "${{ github.sha }}" \
                 artifacts/ActionsMonitor.zip \
                 artifacts/ActionsMonitor-linux.zip > "$OUT" 2>&1; then
              cat "$OUT"
              echo "version_tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Released as $TAG"
              exit 0
            fi
            cat "$OUT"
            if grep -qE "immutable release|Cannot create ref|already_exists|already exists" "$OUT"; then
              TAG="${BASE}.${N}"
              N=$((N + 1))
              echo "Tag reserved, retrying as $TAG"
              continue
            fi
            echo "Release creation failed for unrecoverable reason"
            exit 1
          done
          echo "Exhausted tag-suffix attempts"
          exit 1

  update-scoop:
    needs: [release]
    if: ${{ inputs.enable_scoop && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require the ACTIONSMONITOR_RELEASE_TOKEN secret
        env:
          HAS_TOKEN: ${{ secrets.ACTIONSMONITOR_RELEASE_TOKEN != '' }}
        run: |
          # GITHUB_TOKEN cannot bypass the pull-request rule on main (user-owned repo).
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Repository secret ACTIONSMONITOR_RELEASE_TOKEN is missing - the manifest bump push to main would be rejected. See DEVGUIDE.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ACTIONSMONITOR_RELEASE_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: artifacts/

      - name: Refresh manifest
        run: |
          TAG="${{ needs.release.outputs.version_tag }}"
          VERSION="${TAG#v}"
          HASH=$(sha256sum artifacts/ActionsMonitor.zip | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          URL="https://github.com/WizX20/ActionsMonitor/releases/download/${TAG}/ActionsMonitor.zip"
          jq --arg v "$VERSION" --arg h "$HASH" --arg u "$URL" \
             '.version=$v | .hash=$h | .url=$u | .extract_dir="ActionsMonitor"' bucket/actionsmonitor.json \
             > bucket/actionsmonitor.json.tmp
          mv bucket/actionsmonitor.json.tmp bucket/actionsmonitor.json

      - name: Commit manifest bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/actionsmonitor.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump scoop manifest to ${{ needs.release.outputs.version_tag }}"
            git push
          fi

  update-winget:
    needs: [release]
    if: ${{ inputs.enable_winget && needs.release.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Submit winget update
        shell: pwsh
        run: |
          $TAG = "${{ needs.release.outputs.version_tag }}"
          $VERSION = $TAG.TrimStart("v")
          $URL = "https://github.com/WizX20/ActionsMonitor/releases/download/${TAG}/ActionsMonitor.zip"
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update WizX20.ActionsMonitor `
              --version $VERSION `
              --urls $URL `
              --submit `
              --token "${{ secrets.WINGET_PAT }}"

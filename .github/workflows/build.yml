name: Weekly Build

on:
  schedule:
    # Once a week, Tuesday 06:00 UTC. The _release.yml `check` job skips when
    # main has not moved since the last release, so a quiet week costs one
    # short run and no release. If a run is lost (runner starvation, transient
    # failure), dispatch it by hand rather than waiting a week.
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      enable_scoop: true
      enable_winget: false
      tag_strategy: overwrite
    secrets: inherit
